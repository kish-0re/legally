      width: 100%;

          <p>The case highlighted the critical role of intellectual property in the tech industry and shaped the competitive landscape of the global smartphone market.</p>

          <p>In the tech world, innovation and unique design are not just product features—they are powerful and protectable legal assets.</p>
        `
      }
    ];

    function renderCaseCards() {
      caseGrid.innerHTML = cases.map((caseItem, index) => `
        <div class="case-card" data-index="${index}">
          <h3>${caseItem.title}</h3>
          <p class="teaser">${caseItem.teaser}</p>
          <button class="read-more-btn" data-index="${index}">Read Full Case</button>
        </div>
      `).join('');
    }

    function showModalWithCase(index) {
      const caseData = cases[index];
      modalBody.innerHTML = caseData.content;
      caseModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeModal() {
      caseModal.classList.add('hidden');
      document.body.style.overflow = ''; // Restore background scrolling
    }

    // Event Listeners
    caseGrid.addEventListener('click', (e) => {
      const target = e.target.closest('.case-card, .read-more-btn');
      if (target) {
        const index = parseInt(target.dataset.index, 10);
        showModalWithCase(index);
      }
    });

    modalCloseBtn.addEventListener('click', closeModal);
    caseModal.addEventListener('click', (e) => { // Close on overlay click
      if (e.target === caseModal) {
        closeModal();
      }
    });
    document.addEventListener('keydown', (e) => { // Close with Escape key
        if (e.key === 'Escape' && !caseModal.classList.contains('hidden')) {
            closeModal();
        }
    });

    // Initial Render
    renderCaseCards();
  </script>
</body>
</html>
